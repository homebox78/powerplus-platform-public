<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>powerAssets 에셋 라이브러리</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <script
      type="text/javascript"
      src="https://appsforoffice.microsoft.com/lib/1.1/hosted/office.js"
    ></script>
  </head>
  <body>
    <div id="root"></div>

    <!-- 구버전 Office(2016 이하 = IE11 웹뷰) 폴백: React18 번들이 안 돌아 백지가 되므로,
         번들과 무관한 ES5 스크립트로 감지해 안내를 띄운다. -->
    <div
      id="legacy-notice"
      style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;padding:56px 28px;box-sizing:border-box;font-family:Pretendard,'Malgun Gothic',sans-serif;background:#F4F4F4;color:#333;text-align:center;overflow:auto;"
    >
      <div style="max-width:320px;margin:0 auto;">
        <img
          src="assets/icon-80.png"
          alt="powerAssets"
          style="display:block;width:56px;height:56px;margin:0 auto 18px;"
        />
        <h2 style="font-size:17px;font-weight:800;margin:0 0 12px;">지원하지 않는 Office 버전</h2>
        <p style="font-size:13px;line-height:1.7;color:#555;margin:0;">
          powerAssets 작업창은 최신 웹 기술을 사용합니다.<br />
          <b style="color:#333;">Office 2019 · 2021 · Microsoft 365</b> 에서<br />사용해 주세요.
        </p>
        <p style="font-size:12px;line-height:1.6;color:#999;margin:16px 0 0;">
          현재 Office 2016 이하 버전은 작업창이<br />정상적으로 표시되지 않습니다.
        </p>
      </div>
    </div>

    <script type="text/javascript">
      (function () {
        try {
          var modern = !!(
            window.Promise &&
            window.fetch &&
            window.Symbol &&
            window.Map &&
            window.WeakMap
          );
          var isIE =
            /Trident|MSIE/.test(navigator.userAgent) || !!document.documentMode;
          if (!modern || isIE) {
            var n = document.getElementById("legacy-notice");
            if (n) n.style.display = "block";
            var r = document.getElementById("root");
            if (r) r.style.display = "none";
            // 전용 업그레이드 권장 페이지로 연결(리다이렉트 실패 시 위 인라인 안내가 남음)
            try {
              window.location.replace("unsupported.html");
            } catch (e) {}
          }
        } catch (e) {}
      })();
    </script>
  </body>
</html>
