<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>powerAssets — 지원하지 않는 Office 버전</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        font-family: Pretendard, "Malgun Gothic", sans-serif;
        background: #edf1f5;
        color: #333;
      }
      .tbl {
        display: table;
        width: 100%;
        height: 100%;
      }
      .cell {
        display: table-cell;
        vertical-align: middle;
        text-align: center;
        padding: 24px;
      }
      .card {
        display: inline-block;
        width: 100%;
        max-width: 320px;
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.08);
        padding: 30px 24px;
        box-sizing: border-box;
        text-align: center;
      }
      .logo {
        display: block;
        width: 56px;
        height: 56px;
        margin: 0 auto 18px;
      }
      h1 {
        font-size: 18px;
        font-weight: 800;
        margin: 0 0 10px;
        color: #333;
      }
      .desc {
        font-size: 13px;
        line-height: 1.7;
        color: #555;
        margin: 0 0 18px;
      }
      .box {
        background: #f0f3f6;
        border-radius: 12px;
        padding: 14px 16px;
        text-align: left;
        margin: 0 0 14px;
      }
      .box .t {
        font-size: 12px;
        font-weight: 800;
        color: #c43e1c;
        margin: 0 0 6px;
      }
      .box .b {
        font-size: 12px;
        line-height: 1.7;
        color: #555;
        margin: 0;
      }
      .ok {
        font-size: 13px;
        font-weight: 700;
        color: #333;
      }
      .foot {
        font-size: 11px;
        color: #999;
        margin: 16px 0 0;
        line-height: 1.6;
      }
      b {
        color: #333;
      }
    </style>
  </head>
  <body>
    <div class="tbl">
      <div class="cell">
        <div class="card">
          <img class="logo" src="assets/icon-80.png" alt="powerAssets" />
          <h1>지원하지 않는 Office 버전</h1>
          <p class="desc">
            powerAssets 작업창은 최신 웹 기술을 사용합니다.<br />
            지금 사용 중인 <b>Office 2016 이하</b> 버전에서는<br />
            화면이 정상적으로 표시되지 않습니다.
          </p>

          <div class="box">
            <p class="t">이렇게 해주세요</p>
            <p class="b">
              <span class="ok">Office 2019 · 2021 · Microsoft 365</span> 중<br />
              하나로 업그레이드하면 바로 사용할 수 있습니다.
            </p>
          </div>

          <div class="box">
            <p class="t">내 Office 버전 확인</p>
            <p class="b">
              PowerPoint 상단 <b>파일 &gt; 계정 &gt; Office 정보</b>에서<br />
              버전을 확인할 수 있습니다.
            </p>
          </div>

          <p class="foot">
            powerAssets 에셋 라이브러리<br />
            업그레이드 후 다시 열면 정상 작동합니다.
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
