<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  언어별 대신 그리기 서체(R82, 2026-10-18) — 엔진 서버 LibreOffice 렌더·fc-match 가 쓴다.
  scripts/deploy-engine.sh 가 엔진 서비스 사용자의 ~/.config/fontconfig/conf.d/ 에 넣고 fc-cache 를 돌린다.
  고치기 전(실측): lang=ja 의 대신 그리기가 WenQuanYi(중국어 서체)라 일본어 가나·한자가 중국어 모양으로 나왔다.
  1) 서체 이름 없이 sans-serif·sans 로 부를 때(kfont 의 fc-match 'sans:lang=ja' 등) → 그 언어 서체를 맨 앞에.
  2) 고른 서체에 글자가 없어 대신 그릴 때 → 고른 서체 바로 뒤에 그 언어 서체(시스템 기본 순서에서 WenQuanYi 가 먼저 나오지 않게).
  Noto Sans JP·SC = 엔진이 깐 정적 TTF(engine/fonts, ~/.local/share/fonts/powerdeck) / Noto Sans CJK = 시스템 fonts-noto-cjk.
-->
<fontconfig>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ja</string></test>
    <test qual="any" name="family" compare="eq"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans JP</string><string>Noto Sans CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ja</string></test>
    <test qual="any" name="family" compare="eq"><string>sans</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans JP</string><string>Noto Sans CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ja</string></test>
    <edit name="family" mode="append" binding="strong"><string>Noto Sans JP</string><string>Noto Sans CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-cn</string></test>
    <test qual="any" name="family" compare="eq"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans SC</string><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-cn</string></test>
    <test qual="any" name="family" compare="eq"><string>sans</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans SC</string><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-cn</string></test>
    <edit name="family" mode="append" binding="strong"><string>Noto Sans SC</string><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ko</string></test>
    <test qual="any" name="family" compare="eq"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK KR</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ko</string></test>
    <test qual="any" name="family" compare="eq"><string>sans</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK KR</string></edit>
  </match>
</fontconfig>
