# powerMCP Apache 연결 — powerplus.hom2box.com(나중 powerplus.solideos.com) HTTPS 가상호스트 <VirtualHost *:443> 안에 넣는다.
# 출처: homebox-handoff scripts/deploy-mcp.sh 의 ProxyPass(/homebox/mcp → :3100) 를 플랫폼 경로로.
# 필요 모듈: sudo a2enmod proxy proxy_http  · 넣은 뒤: sudo apache2ctl configtest && sudo systemctl reload apache2
# 주의: SPA 재작성(platform.htaccess)보다 ProxyPass 가 먼저 처리된다(가상호스트 설정은 .htaccess 보다 앞). /mcp 는 SPA 라우트로 쓰지 않는다.
ProxyPreserveHost On
ProxyTimeout 120
# 헬스 먼저(더 긴 경로 먼저)
ProxyPass        /mcp/health http://127.0.0.1:3110/mcp/health
ProxyPassReverse /mcp/health http://127.0.0.1:3110/mcp/health
ProxyPass        /mcp        http://127.0.0.1:3110/mcp
ProxyPassReverse /mcp        http://127.0.0.1:3110/mcp
# Streamable HTTP 는 text/event-stream 으로 답할 수 있다 — 압축·버퍼링 끄기
<Location /mcp>
    SetEnv no-gzip 1
    SetEnv proxy-sendchunked 1
</Location>
# 옛 주소 호환(외부 사용자가 이미 등록한 주소)은 당분간 기존 /homebox/mcp(홈박스 MCP :3100)를 그대로 둔다.
# powerMCP 로 옮길 때: ProxyPass /homebox/mcp http://127.0.0.1:3110/mcp — 단 옛 키(hb_live_)는 core_api_keys 에 이관돼 있어야 통과한다.
